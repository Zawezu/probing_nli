[project]
name = "bachelor-thesis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "datasets>=4.6.1",
    "flash-attn",
    "icecream>=2.1.11",
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "jaxtyping>=0.3.9",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "nltk>=3.9.4",
    "pandas>=3.0.1",
    "pip>=26.0.1",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "torch == 2.10.0+cu130",
    "transformers>=5.2.0",
]

[tool.uv]
index-strategy = "unsafe-best-match" 
extra-index-url = ["https://download.pytorch.org/whl/cu130"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
# Python 3.13 wheel - incompatible with this project's requires-python (>=3.12,<3.13),
# so uv silently skips it and flash_attn ends up missing. Kept for reference.
# flash-attn = { path = "wheels/flash_attn-2.8.3+cu128torch2.10.0cxx11abiTRUE-cp313-cp313-win_amd64.whl" }
# Same wheel fetched over the network. Its filename advertises the version as
# 2.8.3+cu130torch2.10.0cxx11abiTRUE, but the METADATA inside it says plain 2.8.3, so uv
# plans the install from the filename and then reads a different version back, and
# reinstalls the package on every single sync. Kept for provenance: re-download from here
# and save it under the local name below, which matches the metadata.
# flash-attn = { url = "https://huggingface.co/ussoewwin/Flash-Attention-2_for_Windows/resolve/main/flash_attn-2.8.3%2Bcu130torch2.10.0cxx11abiTRUE-cp312-cp312-win_amd64.whl" }
flash-attn = { path = "wheels/flash_attn-2.8.3-cp312-cp312-win_amd64.whl" }

